# Optional: only needed if you don't already have a PostgreSQL server running.
# You mentioned you already have PostgreSQL from another project — in that case
# skip this file entirely and just point DATABASE_URL in .env at a NEW database
# (e.g. `productsmanagement`) on your existing server.
#
# To use this instead: docker compose up -d
version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: productsmanagement
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
